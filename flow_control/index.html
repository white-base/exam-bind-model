<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>흐름 제어 예제</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>흐름 제어 예제</h2>
  <form class="row g-3 needs-validation" novalidate>
    <!-- 텍스트 -->
    <div class="col-md-6">
      <label for="inputName" class="form-label">이름</label>
      <input type="text" class="form-control" id="inputName" required>
      <div class="invalid-feedback">
        이름을 입력해주세요.
      </div>
    </div>

    <!-- 이메일 -->
    <div class="col-md-6">
      <label for="inputEmail" class="form-label">이메일</label>
      <input type="email" class="form-control" id="inputEmail" required>
      <div class="invalid-feedback">
        유효한 이메일 주소를 입력해주세요.
      </div>
    </div>

    <!-- 제출 버튼 -->
    <div class="col-12">
      <button class="btn btn-primary" type="button" id="btn_Submit1">SEND</button>
      <button class="btn btn-primary" type="button" id="btn_Submit2">VIEW</button>
      <button class="btn btn-primary" type="button" id="btn_Submit3">ALL</button>
      <button class="btn btn-primary" type="button" id="btn_Submit4">PICK</button>
      command 정의된 콜백
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="button" id="btn_Submit5">SEND</button>
      <button class="btn btn-primary" type="button" id="btn_Submit6">VIEW</button>
      <button class="btn btn-primary" type="button" id="btn_Submit7">ALL</button>
      <button class="btn btn-primary" type="button" id="btn_Submit8">PICK</button>
      model 에 정의된 콜백
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="button" id="btn_Submit9">SEND</button>
      <button class="btn btn-primary" type="button" id="btn_Submit10">VIEW</button>
      <button class="btn btn-primary" type="button" id="btn_Submit11">ALL</button>
      <button class="btn btn-primary" type="button" id="btn_Submit12">PICK</button>
      model 과 command 에 정의된 콜백
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="main.js"></script>
<!-- 유효성 검사 스크립트 -->
</body>
</html>
