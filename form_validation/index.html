<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>폼 유효성 검사 예제</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>폼 유효성 검사 예제</h2>
  <form class="row g-3 needs-validation" novalidate>
    <!-- 텍스트 -->
    <div class="col-md-6">
      <label for="inputName" class="form-label">이름</label>
      <input type="text" class="form-control" id="inputName" required>
      <div class="invalid-feedback">
        이름을 입력해주세요.
      </div>
    </div>

    <!-- 이메일 -->
    <div class="col-md-6">
      <label for="inputEmail" class="form-label">이메일</label>
      <input type="email" class="form-control" id="inputEmail" required>
      <div class="invalid-feedback">
        유효한 이메일 주소를 입력해주세요.
      </div>
    </div>

    <!-- 비밀번호 -->
    <div class="col-md-6">
      <label for="inputPassword" class="form-label">비밀번호</label>
      <input type="password" class="form-control" id="inputPassword" required minlength="6">
      <div class="invalid-feedback">
        비밀번호는 6자 이상이어야 합니다.
      </div>
    </div>

    <!-- 셀렉트박스 -->
    <div class="col-md-6">
      <label for="inputState" class="form-label">국가</label>
      <select class="form-select" id="inputState" required>
        <option value="">선택...</option>
        <option>대한민국</option>
        <option>일본</option>
        <option>미국</option>
      </select>
      <div class="invalid-feedback">
        국가를 선택해주세요.
      </div>
    </div>

    <!-- 라디오 버튼 -->
    <div class="mb-3">
      <label class="form-label d-block">성별</label>

      <!-- 감싸는 div를 추가하여 피드백을 연결 -->
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="male" required>
        <label class="form-check-label" for="male">남성</label>
      </div>

      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="female">
        <label class="form-check-label" for="female">여성</label>
      </div>

      <!-- 여기서 피드백 메시지는 input들과 같은 부모 안에 있어야 함 -->
      <div class="invalid-feedback" id="gender-feedback">
        성별을 선택해주세요.
      </div>
    </div>

    <!-- 체크박스 -->
    <div class="col-md-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="termsCheck" required>
        <label class="form-check-label" for="termsCheck">
          이용약관에 동의합니다.
        </label>
        <div class="invalid-feedback">
          동의가 필요합니다.
        </div>
      </div>
    </div>

    <!-- 파일 업로드 -->
    <div class="col-md-12">
      <label for="formFile" class="form-label">파일 업로드</label>
      <input class="form-control" type="file" id="formFile" required>
      <div class="invalid-feedback">
        파일을 선택해주세요.
      </div>
    </div>

    <!-- 텍스트에어리어 -->
    <div class="col-md-12">
      <label for="message" class="form-label">메시지</label>
      <textarea class="form-control" id="message" rows="3" required></textarea>
      <div class="invalid-feedback">
        메시지를 입력해주세요.
      </div>
    </div>

    <!-- 제출 버튼 -->
    <div class="col-12">
      <button class="btn btn-primary" type="submit" id="btn_Submit">제출</button>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="main.js"></script>

(() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')

  Array.from(forms).forEach(form => {
    // 💡 성별 선택 시 즉시 피드백 제거 (라디오 그룹)
    const genderRadios = form.querySelectorAll('input[name="gender"]');
    const genderFeedback = form.querySelector('#gender-feedback');

    if (genderRadios.length && genderFeedback) {
      genderRadios.forEach(radio => {
        radio.addEventListener('change', () => {
          if ([...genderRadios].some(r => r.checked)) {
            genderFeedback.style.display = 'none'; // 피드백 숨기기
          }
        });
      });
    }

    form.addEventListener('submit', event => {
      event.preventDefault()
      event.stopPropagation()

      // Bootstrap 시각적 효과 적용
      form.classList.add('was-validated')

      const isGenderSelected = [...genderRadios].some(r => r.checked);

      // ✅ 라디오 수동 검증
      if (!isGenderSelected && genderFeedback) {
        genderFeedback.style.display = 'block';
      } else if (genderFeedback) {
        genderFeedback.style.display = 'none';
      }

      // ✅ 폼 유효성 검사
      if (form.checkValidity()) {
        // 모든 검사를 통과했을 때만 실행
        if (typeof bm !== 'undefined' && bm.cmd && bm.cmd['create']) {
          bm.cmd['create'].execute()
        } else {
          console.warn('BindModel 또는 create 명령이 정의되지 않았습니다.')
        }
      } else {
        // 유효하지 않을 때 메시지 (선택사항)
        alert('입력값을 확인해 주세요.')
      }
    }, false)
  })
})()

</script>
</body>
</html>
