<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>흐름 제어 예제</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <form class="row g-3 needs-validation" novalidate>
    
    <h2>JSON</h2>
    <div class="col-12">
      <label for="cbResult" class="form-label">입력 데이터</label>
      <textarea class="form-control" id="cbResult" rows="10">
{
    "u_name": "kimneo",
    "email": "kimneo@example.com",
    "age": 30,
    "gender": "male"
}

      </textarea>
    </div>

    <!-- 제출 버튼 -->
    <div class="col-12">
      <button class="btn btn-primary" type="button" id="btn_Submit1">SEND</button>
      <button class="btn btn-primary" type="button" id="btn_Submit2">VIEW</button>
      <button class="btn btn-primary" type="button" id="btn_Submit3">ALL</button>
      <button class="btn btn-primary" type="button" id="btn_Submit4">PICK</button>
      command 정의된 콜백
    </div>

    <h2>columns</h2>
    <!-- 텍스트 -->
    <div class="col-md-2">
      <label for="inputName" class="form-label">이름</label>
      <input type="text" class="form-control" id="inputName" required>
    </div>

    <!-- 이메일 -->
    <div class="col-md-2">
      <label for="inputEmail" class="form-label">이메일</label>
      <input type="email" class="form-control" id="inputEmail" required>
    </div>
    
    <div class="col-md-2">
      <label for="inputState" class="form-label">국가</label>
      <select class="form-select" id="inputState" required>
        <option value="">선택...</option>
        <option>대한민국</option>
        <option>일본</option>
        <option>미국</option>
      </select>
    </div>

    <div class="col-md-2">
      <label class="form-label d-block">성별</label>

      <!-- 감싸는 div를 추가하여 피드백을 연결 -->
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="male" required value="male">
        <label class="form-check-label" for="male">남성</label>
      </div>

      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="female" required value="female">
        <label class="form-check-label" for="female">여성</label>
      </div>
    </div>

    <h2>rows</h2>
    <style>
      .grid-table {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 3열 */
        border: 1px solid #ccc;
      }

      .grid-cell {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
      }

      .header {
        background-color: #f0f0f0;
        font-weight: bold;
      }
    </style>

    <div class="grid-table">
      <div class="grid-cell header">이름</div>
      <div class="grid-cell header">나이</div>
      <div class="grid-cell header">국가</div>
      <div class="grid-cell header">성별</div>

      <div class="grid-cell">홍길동</div>
      <div class="grid-cell">30</div>
      <div class="grid-cell">대한민국</div>
      <div class="grid-cell">남성</div>

      <div class="grid-cell">김영희</div>
      <div class="grid-cell">25</div>
      <div class="grid-cell">대한민국</div>
      <div class="grid-cell">여성</div>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="main.js"></script>
<!-- 유효성 검사 스크립트 -->
</body>
</html>
