<!DOCTYPE html>
<html lang="en">
  <head>
    <title>BindModel Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container mt-3">
      <h2>Notice Front Page</h2>
      <h5>Key functions: List Lookup</h5>
      <p>
        Data is transmitted when modified or deleted from the test page, but it
        is not actually processed.
      </p>
      <table class="table">
        <thead class="table-light text-center align-middle">
          <tr>
            <th>Title</th>
            <th data-sort="create_dt" class="sortable">Created Date <i class="bi bi-arrow-down-up" style="color: red;"></i></th>
          </tr>
        </thead>
        <tbody id="area-tbody"></tbody>

        <!-- Template -->
        <script id="area-temp" type="text/x-handlebars-template">
          {{#each this}}
          <tr>
            <td><a href="#" class="btnNormal" data-index="{{@index}}">{{title}}</a></td>
            <td>{{create_dt}}</td>
          </tr>
          {{/each}}
        </script>
      </table>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
