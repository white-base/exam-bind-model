<!DOCTYPE html>
<html lang="en">
  <head>
    <title>BindModel Pagination Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div class="container mt-3">
      <h2>Notice Front Page</h2>
      <h5>Key functions: List Lookup</h5>
      <p>
        Data is transmitted when modified or deleted from the test page, but it
        is not actually processed.
      </p>
      <div class="row mb-3">
        <div class="col-md-4">
          <input type="text" id="keyword" class="form-control" placeholder="Enter keyword" />
        </div>
        <div class="col-md-2">
          <button id="btn_Search" class="btn btn-secondary">Search</button>
        </div>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="area-tbody">
          <tr>
            <td colspan="2">There is no content.</td>
          </tr>
        </tbody>
        <!-- Template -->
        <script id="area-temp" type="text/x-handlebars-template">
          {{#each this}}
          <tr>
            <td><a href="#" class="btnNormal" data-index="{{@index}}">{{title}}</a></td>
            <td>{{create_dt}}</td>
          </tr>
          {{/each}}
        </script>
      </table>
      <!-- pagination -->
      <div id="pagination"></div>
  </body>
</html>
